   atualização de cada quadro
   ============================================================ */

function atualizarCamera(t, tempo){
  if (modoLivre) {
    var k = 0.12;
    livre.yaw = lerp(livre.yaw, livre.alvoYaw, k);
    livre.pitch = lerp(livre.pitch, livre.alvoPitch, k);
    livre.fov = lerp(livre.fov, livre.alvoFov, k);
    camera.position.copy(ORIGEM);
    camera.up.set(0, 1, 0);
    camera.lookAt(ORIGEM.clone().add(vetor3(livre.pitch, livre.yaw, 100)));
    if (Math.abs(camera.fov - livre.fov) > 0.01 || camera.near !== 0.3) { camera.fov = livre.fov; camera.near = 0.3; camera.updateProjectionMatrix(); }
    return;
  }

  var est = estadoNoT(t);
  curvaPos.getPoint(est.u, vPos);
  curvaOlha.getPoint(est.u, vOlha);

  // respiração de câmera na mão
  var noAr = faixa(t, A(0.43), A(0.47)) * (1 - faixa(t, 0.966, 0.974));
  var amp = movimentoReduzido ? 0 : lerp(0.12, 1, noAr);
  var respX = (Math.sin(tempo * 0.47) * 0.55 + Math.sin(tempo * 1.13) * 0.22) * amp;
  var respY = (Math.cos(tempo * 0.39) * 0.45 + Math.sin(tempo * 0.91) * 0.18) * amp;

  camera.position.set(vPos.x + respX + mouseX * 1.6 * amp, Math.max(1.0, vPos.y + respY + mouseY * 1.2 * amp), vPos.z);
  // olhando reto pra baixo, o "pra cima" da tela é o norte (senão o mapa gira à toa)
  var descida = vOlha.y - vPos.y;
  var ingreme = faixa(-descida / Math.max(1, vOlha.distanceTo(vPos)), 0.86, 0.97);
  camera.up.set(0, 1 - ingreme, -ingreme).normalize();
  var calma = movimentoReduzido ? 0 : 1;
  vOlha.x += (Math.sin(tempo * 0.21) * 3 + mouseX * 10) * (1 - noAr) * LONGE / 750 * calma;
  vOlha.y += (Math.cos(tempo * 0.17) * 2 + mouseY * 7) * (1 - noAr) * LONGE / 750 * calma;
  camera.lookAt(vOlha);
  camera.rotateZ(est.roll + Math.sin(tempo * 0.31) * 0.006);

  // olhando o planeta de longe, o plano de corte mais perto dá precisão para a profundidade
  var perto = lerp(0.3, 20, faixa(camera.position.y, 1500, 3000) * (1 - faixa(t, 0.575, 0.585)));
  if (Math.abs(camera.fov - est.fov) > 0.01 || Math.abs(camera.near - perto) > 0.01) {
    camera.fov = est.fov;
    camera.near = perto;
    camera.updateProjectionMatrix();
  }
}

function atualizarFades(t, dt){
  var suavidade = 1 - Math.pow(0.0002, dt || 0.016);
  camera.updateMatrixWorld();
  camera.getWorldDirection(vFrente);
  for (var i = 0; i < objetosFade.length; i++) {
    var o = objetosFade[i];
    vTmp.copy(o.mesh.position).sub(camera.position);
    var dist = vTmp.length();
    var aFrente = vTmp.normalize().dot(vFrente);
    var sai = faixa(aFrente, -0.62, -0.10);
    var op;

    if (o.longe) {
      op = faixa(dist, o.longe, o.medio) * (1 - faixa(dist, o.aparece, o.pleno)) * sai;
    } else {
      var entra = faixa(dist, o.aparece, o.pleno);
      var passa = Math.pow(faixa(dist, o.fim, o.some), 2.0);
      var alvo = o.segue || o.mesh;
      var moldura = 1;
      var g = alvo.geometry && alvo.geometry.parameters;
      if (aFrente > 0 && g && g.width) {
        alvo.updateMatrixWorld();
        vBordaA.set(-g.width / 2, 0, 0); alvo.localToWorld(vBordaA); vBordaA.project(camera);
        vBordaB.set( g.width / 2, 0, 0); alvo.localToWorld(vBordaB); vBordaB.project(camera);
        var esq = Math.min(vBordaA.x, vBordaB.x);
        var dir = Math.max(vBordaA.x, vBordaB.x);
        var larguraTela = dir - esq;
        if (larguraTela > 0.0001) {
          var visivelNaTela = Math.min(1, dir) - Math.max(-1, esq);
          moldura = faixa(visivelNaTela / larguraTela, 0.50, 0.90);
        }
        vTela.copy(alvo.position).project(camera);
        moldura *= 1 - faixa(Math.abs(vTela.y), 0.95, 1.4);
      }
      op = entra * passa * sai * moldura;
    }

    op *= (o.max || 1) * janelaDoScroll(o.janela, t);
    if (modoLivre) op = 0;
    o.mesh.material.opacity = lerp(o.mesh.material.opacity, op, suavidade);
    o.mesh.visible = o.mesh.material.opacity > 0.002;
  }

  var k = 1 - Math.pow(0.0005, dt || 0.016);
  for (i = 0; i < fadesJanela.length; i++) {
    var f = fadesJanela[i];
    var alvoOp = modoLivre ? f.livre : (f.janela ? janelaDoScroll(f.janela, t) * f.max : 0);
    f.mat.opacity = lerp(f.mat.opacity, alvoOp, k);
  }
}

/* o céu: as luzes se apagam, as estrelas aparecem, e lá em cima o ar some */
function atualizarCeu(t, tempo, dt){
  var altura = camera.position.y;
  var espaco = modoLivre ? 0 : suave(faixa(altura, 3, 120));
  var rev = modoLivre ? 1 : suave(faixa(t, A(0.162), A(0.210)));
  var vl = modoLivre ? 1 : suave(faixa(t, A(0.172), A(0.228)));
  var px = renderer.getPixelRatio();
  var zoom = clamp(Math.sqrt(60 / camera.fov), 0.85, 1.7);

  [estrelasReais, poeiraVL].forEach(function(p){
    var u = p.material.uniforms;
    u.uMagLimite.value = lerp(2.7, 7.6, rev) + espaco * 0.3;
    u.uPx.value = px;
    u.uZoom.value = zoom;
    u.uTime.value = tempo;
    u.uCintila.value = movimentoReduzido ? 0 : 0.24 * (1 - espaco);
    u.uAtmosfera.value = 1 - espaco;
  });
  estrelasReais.material.uniforms.uOpacity.value = 1 + espaco * 0.15;
  poeiraVL.material.uniforms.uOpacity.value = vl * (0.85 + espaco * 0.15);
  viaLactea.material.uniforms.uOpacity.value = vl * lerp(1.45, 1.25, espaco);
  nuvensMagalhaes.forEach(function(n){ n.material.opacity = vl * 0.45; });

  domo.material.uniforms.uPoluicao.value = 1 - 0.85 * rev;
  domo.material.uniforms.uEspaco.value = espaco;

  // o chão só existe perto do chão; a terra só aparece lá de cima
  var noChaoAinda = altura < 25;
  chao.visible = silhueta.visible = luzesCidade.visible = noChaoAinda || modoLivre;
  terra.visible = !modoLivre && altura > 15;
  atmosfera.visible = !modoLivre && altura > 165;
  atmosfera.material.uniforms.uOpacity.value = faixa(altura, 165, 260);
  terra.material.uniforms.uAltura.value = altura;

  coisasDaTerra.forEach(function(c){
    var op = modoLivre ? 0 : janelaDoScroll(c.janela, t) * c.max;
    if (c.alturaMin) op *= faixa(altura, c.alturaMin, c.alturaMin * 1.6);
    if (c.pulsa) op *= 0.8 + 0.2 * Math.sin(tempo * 2.4);
    c.obj.visible = op > 0.002;
    c.obj.material.opacity = op;
    if (c.obj.visible && c.px) tamanhoNaTela(c.obj, c.px);
  });

  var lu = luzesCidade.material.uniforms;
  lu.uApagar.value = modoLivre ? 1 : faixa(t, A(0.153), A(0.193));
  lu.uPx.value = px;
  lu.uTime.value = tempo;

  if (lua) brilhoLua.material.opacity = lerp(0.12, 0.26, rev);

  var um = destaqueCruz.material.uniforms;
  if (modoLivre) { um.uDesenho.value = 1; um.uOpacity.value = lerp(um.uOpacity.value, 0.55, 0.08); }
  else {
    um.uDesenho.value = suave(faixa(t, A(0.281), A(0.300)));
    um.uOpacity.value = 0.9 * janelaDoScroll(AJ([0.277, 0.285, 0.326, 0.336]), t);
  }
  if (destaqueExtra) {
    var ue = destaqueExtra.material.uniforms;
    ue.uDesenho.value = modoLivre ? 1 : suave(faixa(t, A(0.343), A(0.363)));
    ue.uOpacity.value = modoLivre ? 0.45 : 0.85 * janelaDoScroll(AJ([0.340, 0.348, 0.380, 0.389]), t);
  }

  var ku = 1 - Math.pow(0.001, dt || 0.016);
  var alvoPoeira = modoLivre ? 0 : faixa(t, 0.590, 0.610) * (1 - faixa(t, 0.940, 0.955));
  poeira.material.uniforms.uOpacity.value = lerp(poeira.material.uniforms.uOpacity.value, alvoPoeira, ku);
  poeira.material.uniforms.uTime.value = tempo;
}

function atualizarCoracao(t, tempo){
  var c = coracao;
  // na volta pra casa o coração vem junto, até assentar no céu
  var fv = modoLivre ? 1 : progressoVolta(t);
  c.grupo.position.copy(H_ESTACAO).lerp(H_FINAL, fv);
  c.grupo.quaternion.copy(Q_ESTACAO).slerp(Q_FINAL, fv);
  var W2 = c.grupo.scale.x;
  var distCam = camera.position.distanceTo(c.grupo.position);
  var profundidade = (S_CORACAO - S_ESTACAO) / W2;

  var pos = c.pontos.geometry.attributes.centro.array;
  var tam = c.pontos.geometry.attributes.aSize.array;
  var alfa = c.pontos.geometry.attributes.aAlpha.array;

  c.pecas.forEach(function(p, k){
    var chegou, acendeu;
    if (modoLivre) { chegou = 1; acendeu = 1; }
    else {
      chegou = saida3(faixa(t, p.chegada, p.chegada + 0.016));
      acendeu = suave(faixa(t, p.acende, p.acende + 0.009));
    }
    var m = p.mesh;
    var op = faixa(t, p.chegada, p.chegada + 0.004) * (1 - acendeu);
    if (modoLivre || t > 0.93) op = 0;
    m.material.opacity = op;
    m.visible = op > 0.002;
    if (m.visible) {
      m.position.set(
        lerp(p.ini[0], p.mos[0], chegou),
        lerp(p.ini[1], p.mos[1], chegou),
        lerp(p.ini[2] * profundidade, 0, chegou)
      );
      m.rotation.z = lerp(p.giroIni, p.giro, chegou);
      var s = c.g * 0.9 * (1 - suave(acendeu) * 0.85);
      m.scale.set(s, s, 1);
    }

    var i3 = p.indice * 3;
    var e = suave(faixa(acendeu, 0.2, 1));
    pos[i3]     = lerp(p.mos[0], p.cont[0], e);
    pos[i3 + 1] = lerp(p.mos[1], p.cont[1], e);
    pos[i3 + 2] = 0;
    alfa[p.indice] = faixa(acendeu, 0.05, 0.5);
    tam[p.indice] = lerp(3.4, 2.3, e) * (1 + 0.12 * Math.sin(tempo * 1.7 + k));
  });
  c.pontos.geometry.attributes.centro.needsUpdate = true;
  c.pontos.geometry.attributes.aSize.needsUpdate = true;
  c.pontos.geometry.attributes.aAlpha.needsUpdate = true;

  var pu = c.pontos.material.uniforms;
  pu.uEscalaTela.value = renderer.domElement.height / (2 * Math.tan(camera.fov * RAD / 2));
  pu.uPx.value = renderer.getPixelRatio();
  pu.uTime.value = tempo;

  var desenho = modoLivre ? 1 : suave(faixa(t, 0.862, 0.878));
  var lu = c.linhas.material.uniforms;
  lu.uDesenho.value = desenho;
  lu.uOpacity.value = modoLivre ? 0.8 : 0.9 * faixa(t, 0.859, 0.864);
  var longe = faixa(distCam, 320, 600);
  c.linhaFina.material.opacity = (desenho >= 1 ? 0.5 : 0) * longe;
  c.brilho.material.opacity = 0.2 * desenho * (1 - longe * 0.5);

  var nomeOp = modoLivre ? 0 : janelaDoScroll([0.876, 0.882, 0.893, 0.898], t);
  c.nome.material.opacity = lerp(c.nome.material.opacity, nomeOp, 0.1);
  c.sub.material.opacity = lerp(c.sub.material.opacity, nomeOp, 0.1);
}

/* ---- ajuste de tamanho / tela ---- */
var alturaTrilho = 0, larguraAtual = 0, alturaAtual = 0;
var _tamBuffer;

function tamanhoDaCena(){
  var c = document.getElementById('cena');
  return { w: c.clientWidth || window.innerWidth, h: c.clientHeight || window.innerHeight };
}
var alturaTela = window.innerHeight;

function aoRedimensionar(){
  if (!renderer) return;
  var tam = tamanhoDaCena();
  var w = tam.w, h = tam.h;
  alturaTela = h;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  _tamBuffer = _tamBuffer || new THREE.Vector2();
  renderer.getDrawingBufferSize(_tamBuffer);
  materiaisTela.forEach(function(m){ m.uniforms.uTela.value.copy(_tamBuffer); });

  // o coração cabe na tela, do celular ao monitor
  var dist = S_CORACAO - S_ESTACAO - 8;
  var visAlt = 2 * Math.tan(FOV_CORACAO * RAD / 2) * dist;
  var visLarg = visAlt * camera.aspect;
  var largura = Math.min(visLarg * 0.86, visAlt * 0.44 * (coracao.largura / coracao.altura));
  coracao.grupo.scale.setScalar(largura / 2);
  var meiaAltura = Math.atan(coracao.altura / 2 * largura / 2 / DIST_FINAL) * GRAU;
  rotuloNossa.position.copy(vetor3(dirCoracao.alt - meiaAltura - 1.7, dirCoracao.az, R_ROTULO));
  rotuloNossa.lookAt(grupoCeu.position);

  textosParaAjustar.forEach(function(m){
    var base = m.userData.larguraBase || 1;
    var d = m.userData.distLeitura || 32;
    var fator = m.userData.fator || 0.8;
    var fatorAlt = m.userData.fatorAlt || 0.62;
    var fov = m.userData.fov || 60;
    var meia = Math.tan((fov * RAD) / 2) * d;
    var vLarg = 2 * meia * camera.aspect;
    var vAlt = 2 * meia;
    var proporcao = m.geometry.parameters.height / m.geometry.parameters.width;
    var escala = Math.min(m.userData.maxEscala || 1, (vLarg * fator) / base, (vAlt * fatorAlt) / (base * proporcao));
    m.scale.set(escala, escala, 1);
    if (m.userData.ancora) {
      posicionarAncorado(m);
      if (m.userData.tilt) m.rotateZ(m.userData.tilt);
    }
  });
  objetosFade.forEach(function(o){ if (o.segue) o.mesh.position.copy(o.segue.position); });

  var mundoPorPx = 2 * R_ROTULO * Math.tan(30 * RAD) / h;
  rotulosCeu.forEach(function(m){
    var alt = m.userData.alturaPx * m.userData.proporcaoPx * mundoPorPx * (celular ? 1.1 : 1);
    m.scale.set(alt * m.userData.aspecto, alt, 1);
  });

  // a altura do trilho só muda quando gira o aparelho, e não quando o Safari
  // esconde a barra de endereço, para o progresso da viagem não dar pulo
  var hj = window.innerHeight;
  if (!alturaTrilho || w !== larguraAtual || hj > alturaTrilho * 1.25 || hj < alturaTrilho * 0.75) {
    alturaTrilho = hj;
    document.getElementById('trilho').style.height = (hj * 30) + 'px';
  }
  larguraAtual = w;
  alturaAtual = h;
}

function conferirTamanho(){
  var tam = tamanhoDaCena();
  if (tam.w !== larguraAtual || tam.h !== alturaAtual) aoRedimensionar();
}

/* ============================================================
   interface guiada pelo scroll
   ============================================================ */

var elDica = document.getElementById('dica');
var elBilhete = document.getElementById('bilhete');
var elFinal = document.getElementById('final');
var elProg = document.getElementById('progresso');
var elProgCheio = document.querySelector('#progresso .cheio');

function atualizarInterface(t){
  elDica.classList.toggle('vis', t < A(0.018));
  elBilhete.classList.toggle('vis', t > 0.898 && t < 0.935);
  elFinal.classList.toggle('vis', t > 0.978);
  elProg.classList.toggle('vis', t > 0.015 && t < 0.97);
  elProgCheio.style.transform = 'scaleY(' + t.toFixed(4) + ')';
}

function progressoDoScroll(){
  var max = document.documentElement.scrollHeight - window.innerHeight;
  return max > 0 ? clamp(window.scrollY / max, 0, 1) : 0;
}

/* ============================================================
   olhar o céu livremente
   ============================================================ */

var toques = {};
var distPinca = 0;

function entrarModoLivre(){
  camera.getWorldDirection(vFrente);
  var aa = altAzDoVetor([vFrente.x, vFrente.y, vFrente.z]);
  livre.yaw = livre.alvoYaw = aa.az;
  livre.pitch = livre.alvoPitch = aa.alt;
  livre.fov = livre.alvoFov = camera.fov;
  modoLivre = true;
  document.body.classList.add('modo-livre');
  document.documentElement.style.overflow = 'hidden';
  document.body.style.overflow = 'hidden';
  document.getElementById('cena').style.touchAction = 'none';
  document.getElementById('livreDica').classList.remove('sumiu');
}

function sairModoLivre(){
  modoLivre = false;
  document.body.classList.remove('modo-livre');
  document.documentElement.style.overflow = '';
  document.body.style.overflow = '';
  document.getElementById('cena').style.touchAction = '';
  toques = {};
}

function ondeFicaANossa(){
  if (separacao(dirCoracao, nucleo) < 18) return 'a nossa constelação fica pertinho do centro da Via Láctea';
  if (separacao(dirCoracao, cruz) < 25) return 'a nossa constelação fica pertinho do Cruzeiro do Sul';
  return 'procure a nossa constelação no céu';
}

function prepararModoLivre(){
  var cena = document.getElementById('cena');
  document.getElementById('livreDicaNossa').textContent = ondeFicaANossa();
  document.getElementById('livreTopo').textContent = DATA_EXTENSO + '  ·  ' + HORA_TEXTO + '  ·  ' + NOITE.lugar;

  cena.addEventListener('pointerdown', function(e){
    if (!modoLivre) return;
    toques[e.pointerId] = { x: e.clientX, y: e.clientY };
    try { cena.setPointerCapture(e.pointerId); } catch(err){}
    var ids = Object.keys(toques);
    if (ids.length === 2) distPinca = Math.hypot(toques[ids[0]].x - toques[ids[1]].x, toques[ids[0]].y - toques[ids[1]].y);
  });
  cena.addEventListener('pointermove', function(e){
    if (!modoLivre || !toques[e.pointerId]) return;
    var ids = Object.keys(toques);
    var antes = toques[e.pointerId];
    if (ids.length === 1) {
      var grausPorPx = livre.fov / window.innerHeight;
      livre.alvoYaw = (livre.alvoYaw - (e.clientX - antes.x) * grausPorPx + 360) % 360;
      livre.alvoPitch = clamp(livre.alvoPitch + (e.clientY - antes.y) * grausPorPx, -4, 88);
      if (Math.abs(e.clientX - antes.x) + Math.abs(e.clientY - antes.y) > 2) document.getElementById('livreDica').classList.add('sumiu');
    }
    toques[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids.length === 2) {
      var d = Math.hypot(toques[ids[0]].x - toques[ids[1]].x, toques[ids[0]].y - toques[ids[1]].y);
      if (distPinca > 0) livre.alvoFov = clamp(livre.alvoFov * distPinca / d, 22, 80);
      distPinca = d;
    }
    if (Math.abs(livre.alvoYaw - livre.yaw) > 180) livre.yaw += livre.alvoYaw > livre.yaw ? 360 : -360;
  });
  function soltar(e){ delete toques[e.pointerId]; distPinca = 0; }
  cena.addEventListener('pointerup', soltar);
  cena.addEventListener('pointercancel', soltar);
  cena.addEventListener('wheel', function(e){
    if (!modoLivre) return;
    e.preventDefault();
    livre.alvoFov = clamp(livre.alvoFov * (1 + e.deltaY * 0.0012), 22, 80);
  }, { passive: false });

  // no iPhone, a pinça e o arrastar não podem virar zoom ou scroll da página
  cena.addEventListener('touchmove', function(e){ if (modoLivre) e.preventDefault(); }, { passive: false });
  ['gesturestart', 'gesturechange'].forEach(function(nome){
    document.addEventListener(nome, function(e){ if (modoLivre) e.preventDefault(); }, { passive: false });
  });

  document.getElementById('olharCeu').addEventListener('click', entrarModoLivre);
  document.getElementById('voltar').addEventListener('click', sairModoLivre);
}

/* ============================================================
   laço de animação
   ============================================================ */

function animar(){
  requestAnimationFrame(animar);
  if (!pronto) return;
  var dt = Math.min(relogio.getDelta(), 0.1);
  quadro(dt, relogio.elapsedTime);
}

function quadro(dt, tempo){
  conferirTamanho();
  var passo = 1 - Math.pow(0.001, dt);

  if (!modoLivre) {
    alvoT = tFixo !== null ? tFixo : progressoDoScroll();
    atualT += (alvoT - atualT) * passo;
  }

  atualizarCamera(atualT, tempo);
  grupoCeu.position.copy(camera.position);   // o céu fica sempre no infinito
  atualizarFades(atualT, dt);
  atualizarCeu(atualT, tempo, dt);
  atualizarCoracao(atualT, tempo);
  if (!modoLivre) atualizarInterface(atualT);

  renderer.render(scene, camera);
}

/* ============================================================
   partida
   ============================================================ */

function carregarImagens(){
  var lista = [];
  Object.keys(window.FOTOS_DESTAQUE || {}).forEach(function(k){ lista.push(FOTOS_DESTAQUE[k]); });
  Object.keys(window.FOTOS_MINI || {}).forEach(function(k){
    if (typeof FOTOS_MINI[k] === 'string') FOTOS_MINI[k] = { uri: FOTOS_MINI[k] };
    lista.push(FOTOS_MINI[k]);
  });
  var pendentes = lista.length;
  return new Promise(function(resolve){
    if (!pendentes) return resolve();
    lista.forEach(function(p){
      var img = new Image();
      img.onload = function(){ p.img = img; if (--pendentes === 0) resolve(); };
      img.onerror = function(){ if (--pendentes === 0) resolve(); };
      img.src = p.uri;
    });
  });
}

function carregarFontes(){
  if (!document.fonts || !document.fonts.load) return Promise.resolve();
  return Promise.all([
    document.fonts.load('italic 400 100px "Cormorant Garamond"'),
    document.fonts.load('400 100px "Cormorant Garamond"'),
    document.fonts.load('300 60px "Jost"')
  ]).catch(function(){});
}

document.getElementById('verDeNovo').addEventListener('click', function(){
  var inicio = window.scrollY;
  var t0 = performance.now();
  var dur = 2600;
  (function subir(agora){
    var k = clamp((agora - t0) / dur, 0, 1);
    var e = k < 0.5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    window.scrollTo(0, inicio * (1 - e));
    if (k < 1) requestAnimationFrame(subir);
  })(t0);
});

window.addEventListener('pointermove', function(e){
  if (e.pointerType === 'touch') return;
  mouseX = (e.clientX / window.innerWidth - 0.5) * 2;
  mouseY = -(e.clientY / window.innerHeight - 0.5) * 2;
}, { passive:true });

if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
if (tInicial === null) window.scrollTo(0, 0);

var dadosOk = typeof ASTRO !== 'undefined' && typeof ESTRELAS !== 'undefined' && typeof FOTOS_DESTAQUE !== 'undefined';

Promise.all([carregarFontes(), carregarImagens(), comLimite(promessaTerra, 9000), comLimite(promessaPaises, 5000)]).then(function(){
  if (!dadosOk || !temWebGL || pedeSimples) {
    montarVersaoSimples();
    return;
  }
  try {
    calcularCeu();
    iniciar3D();
    prepararModoLivre();
  } catch (err) {
    console.error(err);
    montarVersaoSimples();
    return;
  }
  if (tInicial !== null) {
    var max = document.documentElement.scrollHeight - window.innerHeight;
    if (!MODO_TESTE) window.scrollTo(0, tInicial * max);
    atualT = alvoT = tInicial;
  }
  // para testar: __ceu.ir(0.5) pula para um ponto da viagem e desenha na hora
  window.__ceu = {
    camera: camera, get t(){ return atualT; },
    ir: function(t, quadros){
      var max = document.documentElement.scrollHeight - window.innerHeight;
      if (!MODO_TESTE) window.scrollTo(0, t * max);
      else tFixo = t;
      atualT = alvoT = t;
      for (var i = 0; i < (quadros || 90); i++) quadro(1 / 60, relogio.elapsedTime + i / 60);
    }
  };
  if (MODO_TESTE) {
    var ml = /[?&]livre=([\d.-]+),([\d.-]+),([\d.]+)/.exec(window.location.search);
    if (ml) {
      entrarModoLivre();
      livre.yaw = livre.alvoYaw = parseFloat(ml[1]);
      livre.pitch = livre.alvoPitch = parseFloat(ml[2]);
      livre.fov = livre.alvoFov = parseFloat(ml[3]);
    }
    window.__ceu.ir(tInicial || 0, 120);
  } else {
    animar();
  }
  setTimeout(function(){
    document.getElementById('carregando').classList.add('saiu');
  }, 350);
});

})();
</script>
